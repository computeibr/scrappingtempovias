services:

  # ── Aplicação Node.js + Frontend (VPS/EasyPanel — sem scraping) ──────────────
  # O ETL roda na máquina local via PM2 (ETL_ENABLED=true no .env local).
  # No EasyPanel, configure ETL_ENABLED=false nas variáveis de ambiente da service.
  app:
    build:
      context: .
      args:
        VITE_GOOGLE_MAPS_KEY: ${VITE_GOOGLE_MAPS_KEY}
    restart: always
    ports:
      - "${PORT:-3001}:3001"
    environment:
      PORT: 3001
      SECRET: ${SECRET}
      DB: ${DB}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_SSL: ${DB_SSL:-false}
      ETL_ENABLED: ${ETL_ENABLED:-false}
      ETL_FAILOVER: ${ETL_FAILOVER:-false}
    volumes:
      # Volume persistente para avatares — sobrevive a qualquer redeploy
      - uploads:/app/public/upload

volumes:
  uploads:
    driver: local

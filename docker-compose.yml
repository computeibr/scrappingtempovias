services:

  # ── Aplicação Node.js + Frontend (web only — sem scraping) ───────────────────
  app:
    build:
      context: .
      args:
        VITE_GOOGLE_MAPS_KEY: ${VITE_GOOGLE_MAPS_KEY}
    restart: always
    ports:
      - "${PORT:-3001}:3001"
    environment:
      PORT: 3001
      SECRET: ${SECRET}
      DB: ${DB}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_SSL: ${DB_SSL:-false}
      ETL_ENABLED: ${ETL_ENABLED:-true}
